services:
  ui:
    image: ui:v1
    ports:
      - "80:8080"
    environment:
      RETAIL_UI_ENDPOINTS_CATALOG: "http://catalog:8080"
      RETAIL_UI_ENDPOINTS_CARTS: "http://carts:8080"
      RETAIL_UI_ENDPOINTS_ORDERS: "http://orders:8080"
      RETAIL_UI_ENDPOINTS_CHECKOUT: "http://checkout:8080"
    depends_on:
      - carts
      - orders
      - checkout
      - catalog
    networks:
      - retail_net
    restart: unless-stopped

  carts:
    image: cart:v1
    environment:
      RETAIL_CART_PERSISTENCE_PROVIDER: "dynamodb"
      RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: "http://carts-db:8000"
      RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      AWS_REGION: "us-east-1"
    depends_on:
      carts-db:
        condition: service_healthy

    networks:
      - retail_net
    restart: unless-stopped


  carts-db:
    image: amazon/dynamodb-local
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - carts_data:/home/dynamodblocal/data
    networks:
      - retail_net
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 5s
      start_period: 5s

  orders:
    image: orders:v1
    environment:
      RETAIL_ORDERS_PERSISTENCE_PROVIDER: "postgres" 
      RETAIL_ORDERS_PERSISTENCE_ENDPOINT: "orders-db:5432"
      RETAIL_ORDERS_PERSISTENCE_NAME: "orders"
      RETAIL_ORDERS_PERSISTENCE_USERNAME: "postgres"
      RETAIL_ORDERS_PERSISTENCE_PASSWORD: "orders_password"
      RETAIL_ORDERS_MESSAGING_PROVIDER: "rabbitmq"
      RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES: "orders-messaging:5672"
      RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME: "rabbit_user"
      RETAIL_ORDERS_MESSAGING_RABBITMQ_PASSWORD: "rabbit_pass"

    depends_on:
      orders-db:
        condition: service_healthy
      orders-messaging:
        condition: service_healthy

    networks:
      - retail_net
    restart: unless-stopped
  
  orders-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "orders_password"
      POSTGRES_DB: "orders"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orders_data:/var/lib/postgresql
    networks:
      - retail_net

  orders-messaging:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "rabbit_user"
      RABBITMQ_DEFAULT_PASS: "rabbit_pass"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retail_net

  catalog:
    image: catalog:v1
    environment:
      RETAIL_CATALOG_PERSISTENCE_PROVIDER: "mysql"
      RETAIL_CATALOG_PERSISTENCE_ENDPOINT: "catalog-db:3306"
      RETAIL_CATALOG_PERSISTENCE_DB_NAME: "catalogdb"
      RETAIL_CATALOG_PERSISTENCE_USER: "catalog_user"
      RETAIL_CATALOG_PERSISTENCE_PASSWORD: "catalog_pass"

    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - retail_net
    restart: unless-stopped

  catalog-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "catalogdb"
      MYSQL_USER: "catalog_user"
      MYSQL_PASSWORD: "catalog_pass"
      MYSQL_ROOT_PASSWORD: "root_pass"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - catalog_data:/var/lib/mysql
    networks:
      - retail_net

  checkout:
    image: checkout:v1
    environment:
      RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: "redis"
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: "redis://checkout-redis:6379"
      RETAIL_CHECKOUT_ENDPOINTS_ORDERS: "http://orders:8080"

    depends_on:
      - checkout-redis
      - orders

    networks:
      - retail_net
    restart: unless-stopped

  checkout-redis:
    image: redis:8-alpine
    networks:
      - retail_net

networks:
  retail_net:
    driver: bridge

volumes:
  catalog_data:
  orders_data:
  carts_data:



  
