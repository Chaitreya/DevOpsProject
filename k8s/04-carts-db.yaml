apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: retail-store
spec:
  selector: 
    db: carts-db
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carts-db
  namespace: retail-store
spec:
  selector:
    matchLabels:
      db: carts-db
  replicas: 1
  serviceName: "carts-db"
  template:
    metadata:
      labels:
        db: carts-db
    spec:
      containers:
        - name: carts-db
          image: amazon/dynamodb-local
          ports:
            - containerPort: 8000
          command: ["java","-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
          volumeMounts:
            - name: carts-db-data
              mountPath: /home/dynamodblocal/data
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: carts-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
