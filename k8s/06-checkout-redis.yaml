apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: retail-store
spec:
  selector:
    db: checkout-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkout-redis
  namespace: retail-store
spec:
  selector:
    matchLabels:
      db: checkout-redis
  replicas: 1
  serviceName: "checkout-redis"
  template:
    metadata:
      labels:
        db: checkout-redis
    spec: 
      containers:
        - name: checkout-redis
          image: redis:8-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c" , "redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3