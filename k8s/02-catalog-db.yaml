apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: retail-store
spec:
  selector:
    db: catalog-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-db
  namespace: retail-store
spec: 
  selector:
    matchLabels:
      db: catalog-db
  serviceName: "catalog-db"
  replicas: 1
  template:
    metadata:
      labels:
        db: catalog-db
    spec:
      containers:
        - name: catalog-db
          image: mysql:8.4
          ports:
          - containerPort: 3306
          readinessProbe:
            exec: 
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env: 
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: retail-store-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: retail-store-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-store-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-store-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: catalog-db-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata: 
        name: catalog-db-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi