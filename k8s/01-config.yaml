apiVersion: v1
kind: ConfigMap
metadata:
  name: retail-store-config
  namespace: retail-store
data:
  MYSQL_DATABASE: "catalogdb"
  MYSQL_USER: "catalog_user"

---

apiVersion: v1
kind: Secret
metadata: 
  name: retail-store-secrets
  namespace: retail-store
type: Opaque
stringData:
  MYSQL_PASSWORD: "catalog_pass"
  MYSQL_ROOT_PASSWORD: "root_pass"